version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native compiler) has no JS API, which @vercel/ncc's
      # TypeScript loader needs; stay on 6.x until ncc supports it.
      - dependency-name: typescript
        versions: ['>=7']
      # Types track the node24 Actions runtime declared in action.yml.
      - dependency-name: '@types/node'
        versions: ['>=25']
    # One PR per group keeps pnpm-lock.yaml edits from conflicting with each other.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  # Bumps the pinned agent-readiness-kit commit that is bundled into dist/.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
