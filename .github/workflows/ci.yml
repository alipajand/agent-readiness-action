name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with the vendored agent-readiness-kit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage thresholds)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Consumers run the committed bundle, so it must match the source.
      - name: Verify dist/ is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'pnpm build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  self-test:
    name: Run the action on this repository
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run agent-readiness-action
        id: audit
        uses: ./
        with:
          output: agent-readiness-report.md
          fail-on-threshold: 'false'

      - name: Check outputs
        env:
          SCORE: ${{ steps.audit.outputs.score }}
          REPORT: ${{ steps.audit.outputs.report-path }}
        run: |
          echo "score=$SCORE report=$REPORT"
          test -n "$SCORE"
          test -f "$REPORT"

  integrations:
    name: Integrations (skill, plugins, MCP server) · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the oldest release with a stable permission model, which the
        # MCP worker sandbox and the clean-install test rely on.
        node: ['22.13.0', '24']

    steps:
      - name: Checkout (with the vendored engines)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm integrations:typecheck

      - name: Build bundles
        run: pnpm integrations:build

      # The skill, the plugins, and the npm package ship these committed files.
      - name: Verify committed bundles are up to date
        run: |
          paths="plugins integrations/mcp-package/dist integrations/src/runtime/provenance.generated.ts"
          if ! git diff --quiet -- $paths || [ -n "$(git status --porcelain -- $paths)" ]; then
            echo "::error::Integration bundles are out of date. Run 'pnpm integrations:build' and commit the result."
            git status --short -- $paths
            exit 1
          fi

      - name: Test (parity, adversarial, plugins, MCP, packaging)
        run: pnpm integrations:test

      # skills-ref runs from a checkout of a pinned commit, and its dependencies
      # are installed from wheels pinned by hash, so nothing unpinned executes.
      - name: Validate the skill with skills-ref
        run: |
          git clone --quiet https://github.com/agentskills/agentskills.git "$RUNNER_TEMP/agentskills"
          git -C "$RUNNER_TEMP/agentskills" checkout --quiet 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet --require-hashes --no-deps --only-binary=:all: \
            -r integrations/ci/skills-ref-requirements.txt
          PYTHONPATH="$RUNNER_TEMP/agentskills/skills-ref/src" "$RUNNER_TEMP/skills-ref/bin/python" \
            -c 'from skills_ref.cli import main; main()' validate plugins/agent-readiness/skills/agent-readiness-audit

      - name: Check the npm package is reproducible
        working-directory: integrations/mcp-package
        run: |
          mkdir -p "$RUNNER_TEMP/pack-a" "$RUNNER_TEMP/pack-b"
          npm pack --pack-destination "$RUNNER_TEMP/pack-a" >/dev/null
          npm pack --pack-destination "$RUNNER_TEMP/pack-b" >/dev/null
          cmp "$RUNNER_TEMP"/pack-a/*.tgz "$RUNNER_TEMP"/pack-b/*.tgz
          sha256sum "$RUNNER_TEMP"/pack-a/*.tgz
