name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with the vendored agent-readiness-kit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Consumers run the committed bundle, so it must match the source.
      - name: Verify dist/ is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'pnpm build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  self-test:
    name: Run the action on this repository
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run agent-readiness-action
        id: audit
        uses: ./
        with:
          output: agent-readiness-report.md
          fail-on-threshold: 'false'

      - name: Check outputs
        env:
          SCORE: ${{ steps.audit.outputs.score }}
          REPORT: ${{ steps.audit.outputs.report-path }}
        run: |
          echo "score=$SCORE report=$REPORT"
          test -n "$SCORE"
          test -f "$REPORT"
