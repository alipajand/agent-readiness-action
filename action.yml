name: Agent Readiness Audit
description: Audit repository readiness for AI coding agents using agent-readiness-kit
author: Ali Pajand

branding:
  icon: check-circle
  color: blue

inputs:
  repo-path:
    description: >
      Path to the repository or subdirectory to audit. Relative paths are
      resolved from the GitHub Actions workspace root (GITHUB_WORKSPACE).
    default: '.'
    required: false
  min-score:
    description: >
      Minimum acceptable agent-readiness score, from 0 to 100. Used when
      fail-on-threshold is true.
    default: '0'
    required: false
  output:
    description: >
      Write a Markdown report to this path. Relative paths are resolved under
      repo-path, and the result must stay inside repo-path. Leave empty to skip
      the report.
    default: ''
    required: false
  json:
    description: Echo the raw JSON audit output to the Actions log.
    default: 'false'
    required: false
  comment-on-pr:
    description: >
      Post or update a summary comment on the pull request. Only runs on
      pull_request events. Comments are created and updated through GitHub's
      issue-comment API, so the token needs pull-requests: write and
      issues: write permissions.
    default: 'false'
    required: false
  github-token:
    description: >
      Token used to post the PR comment, usually the workflow's github.token.
      When empty, the GITHUB_TOKEN environment variable is used.
    default: ''
    required: false
  comment-author:
    description: >
      Only update an earlier summary comment written by this login. Defaults
      to any bot account (GITHUB_TOKEN posts as github-actions[bot]). Set it
      when commenting with a personal access token.
    default: ''
    required: false
  fail-on-threshold:
    description: Fail the workflow step when the score is below min-score.
    default: 'true'
    required: false
  baseline-ref:
    description: >
      Git ref to compare against, usually the pull request base
      (github.event.pull_request.base.sha). The action audits that commit in a
      temporary worktree and reports the score change. The ref must be fetched
      (actions/checkout with fetch-depth: 0).
    default: ''
    required: false
  max-score-drop:
    description: >
      Fail when the score is more than this many points below the
      baseline-ref score. 0 fails on any drop. Requires baseline-ref.
    default: ''
    required: false
  job-summary:
    description: Write the audit summary to the workflow run's job summary.
    default: 'true'
    required: false

outputs:
  score:
    description: Final agent-readiness score, from 0 to 100.
  report-path:
    description: >
      Absolute path of the written Markdown report, or empty when the output
      input was not set.
  passed:
    description: '"true" when the score is at least min-score, otherwise "false".'
  categories:
    description: JSON array of category scores (id, label, score, maxScore).
  baseline-score:
    description: Score at baseline-ref, when baseline-ref is set.
  score-delta:
    description: Score minus the baseline score, when baseline-ref is set.

runs:
  using: node24
  main: dist/index.js
